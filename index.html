  <meta name="description" content="给我留一句匿名悄悄话。有些话，不署名也可以说。" />

  <link rel="stylesheet" href="style.css" />
  <link rel="icon" type="image/png" href="share.png" />
  <link rel="apple-touch-icon" href="share.png" />

  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
</head>
<body data-page="home">
  <main class="app-shell">
    <section class="hero-card glass-card">
      <div class="floating-note note-a">嘘</div>
      <div class="floating-note note-b">匿名</div>
      <div class="floating-note note-c">送达</div>

      <div class="icon-bubble" aria-hidden="true">
        <span class="envelope">✉</span>
      </div>

      <p class="eyebrow">不署名信箱</p>
      <h1>给我留一句<br />匿名悄悄话</h1>
      <p class="subtitle">不会显示你的名字，也不会显示头像。<br />但请温柔一点，我真的会看到。</p>

      <form id="whisperForm" class="whisper-form" autocomplete="off">
        <label class="input-label" for="messageInput">你想悄悄说什么？</label>
        <textarea
          id="messageInput"
          maxlength="120"
          rows="6"
          placeholder="比如：其实我一直觉得你很有趣……"
        ></textarea>
        <div class="form-row">
          <span id="charCount">0 / 120</span>
          <span id="cooldownText" class="muted"></span>
        </div>
        <button id="sendButton" class="primary-btn" type="submit">匿名发送</button>
      </form>

      <div id="successPanel" class="success-panel" hidden>
        <div class="success-mark">✓</div>
        <h2>已送达</h2>
        <p>这句话会悄悄出现在 TA 的信箱里。</p>
        <button id="writeAgainButton" class="secondary-btn" type="button">再写一句</button>
      </div>
    </section>

    <section class="rule-card">
      <h2>匿名小规则</h2>
      <p>匿名是为了把不好意思说的话说出口，不是为了伤害别人。</p>
      <ul>
        <li>每条最多 120 个字。</li>
        <li>发送后不能撤回。</li>
        <li>恶意攻击、威胁、隐私信息不要发。</li>
      </ul>
    </section>

    <footer class="footer-tip">
      <p>第一版是网页演示版。真正跨手机收信，下一步需要接云数据库。</p>
    </footer>
  </main>

  <script src="script.js"></script>
</body>
</html>
