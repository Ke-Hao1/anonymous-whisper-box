<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>毕业信箱主人页</title>
  <meta name="description" content="查看收到的毕业季匿名悄悄话。" />
  <link rel="stylesheet" href="style.css" />
  <link rel="icon" type="image/png" href="share.png" />
  <link rel="apple-touch-icon" href="share.png" />
  <meta name="theme-color" content="#dfe8ff" />
</head>
<body data-page="inbox">
  <main class="app-shell inbox-shell">
    <section id="lockScreen" class="glass-card inbox-lock">
      <div class="icon-bubble small" aria-hidden="true">🔐</div>
      <p class="eyebrow">毕业信箱 · 主人入口</p>
      <h1>查看收到的<br />毕业悄悄话</h1>
      <p class="subtitle">输入主人口令后才能查看。不要把主人页链接发给别人。</p>
      <div class="key-box"><input id="keyInput" type="password" inputmode="numeric" placeholder="请输入主人口令" /><button id="unlockButton" class="primary-btn" type="button">进入信箱</button></div>
      <p id="keyError" class="error-text" hidden>口令不对，或者数据库还没配置好。</p>
    </section>
    <section id="inboxPanel" class="glass-card inbox-panel" hidden>
      <div class="inbox-header"><div><p class="eyebrow">毕业季回忆册</p><h1>收到的悄悄话</h1></div><div class="count-pill"><span id="messageCount">0</span> 条</div></div>
      <div class="toolbar"><button id="exportButton" class="secondary-btn small-btn" type="button">复制全部</button><button id="clearButton" class="danger-btn small-btn" type="button">清空</button></div>
      <div id="emptyState" class="empty-state"><div>🎒</div><h2>还没有收到悄悄话</h2><p>把首页链接发给同学、朋友，让他们给这个毕业季留一句话。</p></div>
      <div id="messageList" class="message-list"></div>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="script.js"></script>
</body>
</html>
